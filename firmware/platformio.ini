; AeroBeam-Tech-Hybrid-LiFi-RF firmware: ONE PlatformIO project, TWO firmwares.
;
; Each [env:...] section builds one firmware for one board:
;   sender   - laser end: pan/tilt servos + microphone -> ESP-NOW   (src/sender/)
;   receiver - panel end: host link commands (UDP), RF failover audio, OLED   (src/receiver/)
;
; Upload ONE environment at a time, to the board it belongs to:
;   pio run -e sender   -t upload --upload-port COMx
;   pio run -e receiver -t upload --upload-port COMy
; Without -e, "upload" builds and flashes BOTH firmwares, one after the other,
; onto the same board, and the board ends up running whichever went last.
; Each firmware prints its name at boot, so the serial monitor shows which one a board runs.
;
; Docs: https://docs.platformio.org/page/projectconf.html

; Settings shared by every environment below.
[env]
; The official platform: ESP32 Arduino core 2.0.17 on this laptop.
; Core 3.x needs the community "pioarduino" platform instead, and a different
; ESP-NOW receive-callback signature in src/receiver/main.cpp.
platform = espressif32
; Assumes both boards are uPesy ESP32 WROOM (as in AeroBeam-Tech). If the receiver
; is a different board, add its own `board = ...` line under [env:receiver].
board = upesy_wroom
framework = arduino
monitor_speed = 115200

[env:sender]
; Compile only src/sender/. Each firmware has its own setup() and loop(),
; so the two folders must never be linked into the same program.
build_src_filter = +<sender/>
lib_deps =
    madhephaestus/ESP32Servo@^3.2.1

[env:receiver]
build_src_filter = +<receiver/>
lib_deps =
    adafruit/Adafruit SH110X@^2.1.15
    adafruit/Adafruit GFX Library@^1.12.6
